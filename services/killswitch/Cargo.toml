[package]
name = "killswitch"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.34", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
ed25519-dalek = { version = "2.0", features = ["pem", "rand_core"] }
rusqlite = { version = "0.30", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
rand = "0.8"

[build-dependencies]
tonic-build = "0.10"
