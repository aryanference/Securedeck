version: '3.8'

networks:
  app_net:
  ks_net:
    internal: true # SEC-10: Isolated network boundary

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: securedeck
      POSTGRES_PASSWORD: securedeck_password
      POSTGRES_DB: securedeck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U securedeck" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  auditlog:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.auditlog
    environment:
      - DB_DSN=postgres://securedeck:securedeck_password@postgres:5432/securedeck?sslmode=disable
      - DB_DIALECT=postgres
      - PORT=50051
      - NATS_MODE=embedded
    ports:
      - "50051:50051"
      - "4222:4222" # Embedded NATS port
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  broker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.broker
    environment:
      - DB_DSN=postgres://securedeck:securedeck_password@postgres:5432/securedeck?sslmode=disable
      - DB_DIALECT=postgres
      - PORT=50052
      - SIGNING_KEY_PATH=/certs/broker.key
      - NATS_URL=nats://auditlog:4222
    ports:
      - "50052:50052"
    volumes:
      - ./certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      auditlog:
        condition: service_started
    networks:
      - app_net

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    environment:
      - DB_DSN=postgres://securedeck:securedeck_password@postgres:5432/securedeck?sslmode=disable
      - DB_DIALECT=postgres
      - PORT=50053
      - HTTP_PORT=8080
      - PROXY_PORT=8888
      - BROKER_ADDR=broker:50052
      - AUDIT_ADDR=auditlog:50051
      - KILLSWITCH_ADDR=killswitch:50053
    ports:
      - "50053:50053" # gRPC (SDK mode)
      - "8080:8080" # REST / health / metrics
      - "8888:8888" # sidecar transparent proxy
    depends_on:
      postgres:
        condition: service_healthy
      auditlog:
        condition: service_started
      broker:
        condition: service_started
    networks:
      - app_net
      - ks_net

  killswitch:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.killswitch
    environment:
      - KS_DB_PATH=/data/killswitch.db
      - BROKER_ADDR=broker:50052
    ports:
      - "50054:50053" # Mapped to 50054 on host machine to avoid conflict with the gateway's gRPC port
    volumes:
      - ksdata:/data
    networks:
      - ks_net
      - app_net

  driftdetector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.driftdetector
    environment:
      - DB_DSN=postgres://securedeck:securedeck_password@postgres:5432/securedeck?sslmode=disable
      - DB_DIALECT=postgres
      - NATS_URL=nats://auditlog:4222
    depends_on:
      postgres:
        condition: service_healthy
      auditlog:
        condition: service_started
    networks:
      - app_net

  swarmengine:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.swarmengine
    environment:
      - PORT=50056
      - NATS_URL=nats://auditlog:4222
    ports:
      - "50056:50056"
    depends_on:
      auditlog:
        condition: service_started
    networks:
      - app_net



volumes:
  pgdata:
  ksdata:
