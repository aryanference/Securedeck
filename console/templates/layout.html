<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="/static/css/style.css">

<body hx-boost="true">

        <div style="font-weight: 600; font-size: 18px; letter-spacing: -0.02em;">

                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Securedeck

        <nav class="nav-links">

        <div>
            <a href="/killswitch" class="pill-button danger" style="text-decoration: none;">Kill Switch</a>
        </div>

    <main id="main-content">
        {{template "content" .}}
    </main>
</body>
</html>
